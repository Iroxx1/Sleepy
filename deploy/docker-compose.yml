# docker compose -f deploy/docker-compose.yml up -d --build
services:
  sleepy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sleepy-data:/data
      # - /srv/cpap-import:/import:ro
    environment:
      SLEEPY_TRUSTED_PROXIES: "127.0.0.1"
      # SLEEPY_IMPORT_DIR: /import
      # Nur beim ersten Start: Admin anlegen (danach entfernen)
      # SLEEPY_INITIAL_ADMIN_USER: admin
      # SLEEPY_INITIAL_ADMIN_PASSWORD: bitte-aendern-123
    restart: unless-stopped
volumes:
  sleepy-data:
