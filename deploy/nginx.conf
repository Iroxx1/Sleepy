# /etc/nginx/sites-available/sleepy  (Beispiel; Zertifikatspfade anpassen)
# In /etc/sleepy/sleepy.env: SLEEPY_TRUSTED_PROXIES=<IP dieses Proxys>, SLEEPY_COOKIE_SECURE=true
server {
    listen 80;
    server_name sleepy.home.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sleepy.home.lan;

    ssl_certificate     /etc/ssl/certs/sleepy.crt;
    ssl_certificate_key /etc/ssl/private/sleepy.key;

    # Große SD-Karten-ZIPs zulassen und direkt durchreichen
    client_max_body_size 8g;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://<LXC-IP>:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
