[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepy"
version = "1.2.0"
description = "Self-hosted CPAP/PAP-Datenanalyse (Backend)"
requires-python = ">=3.11"
dependencies = [
  "sleepy-cpap-parser",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "jinja2>=3.1",
  "reportlab>=4.0",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
parquet = ["pandas>=2.0", "pyarrow>=14"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sleepy = "sleepy.cli:main"

[tool.setuptools.packages.find]
include = ["sleepy*"]

[tool.setuptools.package-data]
sleepy = ["templates/*.html", "migrations/*.mako", "migrations/versions/*.py"]
