# Development tooling configuration (the installable packages live in
# parser/ and backend/).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["parser", "backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017"]
